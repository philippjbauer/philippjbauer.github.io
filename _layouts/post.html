---
layout: base
---
<main>
  <article class="section post">
    <div class="container">
      <p class="eyebrow post-kicker"><a href="/blog/">&larr; All writing</a></p>
      <h1>{{ page.title }}</h1>
      <p class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        {%- if page.categories.size > 0 %}
        <span class="post-tags">{% for category in page.categories %}<span class="tag">{{ category }}</span>{% endfor %}</span>
        {%- endif %}
      </p>
      {% include post-hero.html %}
      <div class="post-body">
        {{ content }}
      </div>
      {% include post-nav.html %}
    </div>
  </article>
</main>
