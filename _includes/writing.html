<h3 class="subhead">Recent blog posts</h3>
<ul class="article-list">
  {%- for post in site.posts limit:3 -%}
  <li><time datetime="{{ post.date | date: "%Y-%m" }}">{{ post.date | date: "%b %Y" }}</time> <a href="{{ post.url }}">{{ post.title }}</a></li>
  {%- endfor -%}
</ul>
<p><a href="/blog/">Go to the blog</a></p>
